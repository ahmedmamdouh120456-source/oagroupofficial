<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | OAGROUP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
      max-width: 600px;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 30px;
    }

    .number {
      font-size: 100px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }

    p {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 13px 26px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }

    a:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="number">404</div>

    <h1>Page Not Found</h1>

    <p>
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <a href="/">Back to OAGROUP</a>

  </div>
</body>
</html>
